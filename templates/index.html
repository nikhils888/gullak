<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gullak · Smart Daily Savings</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --line: #e4e2db;
    --accent: #1f7a4d; --accent-soft: #e3f1e9; --bad: #b3261e; --bad-soft: #fbe5e3;
    --rest: #8a8780; --rest-soft: #eeede8; --bar: #c9d8cf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --card: #1f201d; --text: #ecebe6; --muted: #a09f98; --line: #34352f;
      --accent: #5cc48f; --accent-soft: #1d3428; --bad: #f08a80; --bad-soft: #3b2220;
      --rest: #a09f98; --rest-soft: #2b2c28; --bar: #3a5546;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; }
  .sub { color: var(--muted); margin: 2px 0 0; }
  select, input, button { font: inherit; color: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 8px 12px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .label { color: var(--muted); font-size: 13px; }
  .value { font-size: 24px; font-weight: 600; margin-top: 2px; }
  .plan { border-left: 4px solid var(--accent); margin-bottom: 16px; }
  .plan .value { font-size: 30px; }
  .plan p { margin: 6px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .actions input { width: 140px; }
  .msg { min-height: 20px; color: var(--muted); font-size: 14px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; }
  td.bar { width: 40%; }
  .bar span { display: block; height: 10px; border-radius: 5px; background: var(--bar); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .saved { background: var(--accent-soft); color: var(--accent); }
  .failed { background: var(--bad-soft); color: var(--bad); }
  .rest { background: var(--rest-soft); color: var(--rest); }
  @media (max-width: 560px) { td.bar { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Gullak</h1>
      <p class="sub">Smart daily savings for shopkeepers whose income changes every day</p>
    </div>
    <select id="shop" aria-label="Shop"></select>
  </header>

  <section class="stats">
    <div class="card"><div class="label">Daily goal</div><div class="value" id="goal">-</div></div>
    <div class="card"><div class="label">Saved so far</div><div class="value" id="saved">-</div><div class="label" id="savedPct"></div></div>
    <div class="card"><div class="label">Failed payments</div><div class="value" id="failed">-</div></div>
    <div class="card"><div class="label">Rest days</div><div class="value" id="rest">-</div></div>
  </section>

  <section class="card plan">
    <div class="label" id="planDate">Tomorrow</div>
    <div class="value" id="planAmount">-</div>
    <p id="planMsg"></p>
    <p class="label" id="planForecast"></p>
    <div class="actions">
      <button class="primary" id="simulate">Simulate next day</button>
      <span class="label">or enter income:</span>
      <input id="income" type="number" min="0" step="10" placeholder="₹ income">
      <button id="record">Record</button>
    </div>
    <div class="msg" id="result"></div>
  </section>

  <section class="card">
    <div class="label" style="margin-bottom:8px">Last 30 days</div>
    <table>
      <thead><tr><th>Date</th><th>Income</th><th class="bar"></th><th>Saving</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </section>
</main>

<script>
const rs = n => "₹" + Math.round(n).toLocaleString("en-IN");
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
const $ = id => document.getElementById(id);
let current = null;

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

async function loadShops() {
  const shops = await api("/api/shops");
  $("shop").innerHTML = shops.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
  await loadShop();
}

async function loadShop() {
  const d = await api(`/api/shops/${$("shop").value}`);
  current = d;
  const s = d.summary;
  $("goal").textContent = rs(d.shop.goal_per_day);
  $("saved").textContent = rs(s.saved);
  $("savedPct").textContent = `${Math.round(s.saved / s.goal_so_far * 100)}% of ${rs(s.goal_so_far)} goal · ${s.days} days`;
  $("failed").textContent = s.failed;
  $("rest").textContent = s.rest;

  const t = d.tomorrow;
  $("planDate").textContent = `Tomorrow · ${fmtDate(t.date)}`;
  $("planAmount").textContent = t.amount ? `Save ${rs(t.amount)}` : "Rest day";
  $("planMsg").textContent = t.message;
  $("planForecast").textContent = `AI forecast: expected income ${rs(t.typical_income)} · careful estimate ${rs(t.safe_income)}`;

  const max = Math.max(...d.history.map(h => h.income), 1);
  $("history").innerHTML = d.history.map(h => `
    <tr>
      <td>${fmtDate(h.date)}</td>
      <td>${h.income ? rs(h.income) : "Closed"}</td>
      <td class="bar"><span style="width:${h.income / max * 100}%"></span></td>
      <td>${h.status === "saved" ? `<span class="chip saved">Saved ${rs(h.saved)}</span>`
          : h.status === "failed" ? `<span class="chip failed">Failed (${rs(h.planned)})</span>`
          : `<span class="chip rest">Rest day</span>`}</td>
    </tr>`).join("");
}

function showResult(r) {
  const what = r.status === "saved" ? `saved ${rs(r.saved)}` : r.status === "failed" ? `payment of ${rs(r.planned)} failed` : "rest day";
  $("result").textContent = `${fmtDate(r.date)}: income ${rs(r.income)}, ${what}.`;
}

async function run(path, options) {
  try { showResult(await api(path, options)); await loadShop(); }
  catch (e) { $("result").textContent = e.message; }
}

$("shop").onchange = () => { $("result").textContent = ""; loadShop(); };
$("simulate").onclick = () => run(`/api/shops/${$("shop").value}/simulate-day`, { method: "POST" });
$("record").onclick = () => run(`/api/shops/${$("shop").value}/income`, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ date: current.tomorrow.date, income: Number($("income").value) }),
});
loadShops();
</script>
</body>
</html>
